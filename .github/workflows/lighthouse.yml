name: Lighthouse CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm run build

      - run: npx @lhci/cli autorun

      - name: Show Lighthouse scores in summary
        if: always()
        run: |
          REPORT=$(ls .lighthouseci/lhr-*.json | head -n 1)
          echo "## Résultats Lighthouse" >> $GITHUB_STEP_SUMMARY
          echo "| Catégorie | Score |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          jq -r '.categories | to_entries[] | "| \(.value.title) | \((.value.score * 100) | round) |"' "$REPORT" >> $GITHUB_STEP_SUMMARY